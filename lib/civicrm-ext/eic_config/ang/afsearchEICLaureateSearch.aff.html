  </div>
  <div class="af-container af-container-style-pane" af-title="EIC Project information">
    <div class="af-container af-layout-cols">
      <af-field name="Contact_ActivityContact_Activity_01.subject,Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Project_Title" defn="{label: 'Project Name', input_attrs: {}}" />
      <af-field name="Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Project_Number" defn="{label: 'Project Number', input_attrs: {}}" />

      <af-field name="Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Funding_Type" defn="{input_attrs: {multiple: true}, label: 'Funding Type'}" />

      <af-field name="Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Primary,Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Subsector_1,Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Subsector_2,Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Tech_cluster_1,Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Tech_cluster_2,Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Tech_cluster_3,Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Tech_cluster_4,Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Tech_cluster_5,Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Tech_cluster_6,Contact_ActivityContact_Activity_01.EIC_Horizon_Europe_Project_information.Field_Of_Science" defn="{input_attrs: {multiple: true}, label: 'Subsector s &amp; clusters', search_operator: 'IN'}" />
