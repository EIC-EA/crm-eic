services:
  apache:
    build:
      context: ./apache
    container_name: ${APP_NAME}_apache
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PHP_HOST: "php"
    ports:
      - ${APP_PORT}:80
    volumes:
      - ./apache/vhosts:/etc/apache2/sites-enabled
    volumes_from:
      - php

  php:
    build:
      context: ..
      dockerfile: docker/php/Dockerfile
    container_name: ${APP_NAME}_php
    working_dir: /var/www/html
    volumes:
      - /var/www/html
      - ../lib/civicrm-ext/eic_config:/opt/drupal/civicrm-ext/eic_config:bind
      - ../lib/civicrm-ext/nc_config:/opt/drupal/civicrm-ext/nc_config:bind      
      - ../lib/civicrm-ext/eic_import:/opt/drupal/civicrm-ext/eic_import:bind
      - ../lib/tmp:/opt/drupal/tmp:bind
      - ../lib/config:/opt/drupal/config:bind
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env

  mysql:
    image: mariadb:10.6
    container_name: ${APP_NAME}_mysql
    ports:
      - ${DATABASE_PORT}:3306
    command: --transaction-isolation=READ-COMMITTED --innodb-log-file-size=1G --max_allowed_packet=1G --innodb-buffer-pool-size=512M --wait_timeout=3000 --net_write_timeout=3000
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DRUPAL_DATABASE_NAME}
      MYSQL_PASSWORD: ${DRUPAL_DATABASE_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost", "-uroot", "--silent" ]
      interval: 2s
      timeout: 10s
      retries: 5

  # mailpit:
  #   image: axllent/mailpit:latest
  #   container_name: crm_mailpit
  #   ports:
  #     - "${MAILPIT_UI}:8025"   # Web UI
  #     - "${SMTP_PORT}:1025"   # SMTP
  #     - "${MAILPIT_POP3}:1110"    #
  #   environment:
  #     MP_SMTP_AUTH: "${MAILPIT_SMTP_USER}:${MAILPIT_SMTP_PASSWORD}"
  #     MP_SMTP_AUTH_ALLOW_INSECURE: "true"
  #     MP_UI_AUTH: "${MAILPIT_UI_USER}:${MAILPIT_UI_PASSWORD}"
  #     MP_POP3_AUTH: "${MAILPIT_POP3_USER}:${MAILPIT_POP3_PASSWORD}"
  #   volumes:
  #     - ./mailpit/mailpit.conf:/etc/mailpit.conf

  eicmailcatcher:
    build:
      context: ./eicmailcatcher
    container_name: ${APP_NAME}_eicmailcatcher
    env_file:
      - .env
    ports:
      - "${MC_ROUNDCUBE_UI}:80"
    volumes:
      - eicmailcatcher-mail:/var/mail/vhosts
      - eicmailcatcher-roundcube:/var/lib/roundcube


volumes:
  mysql_data:
  eicmailcatcher-mail:
  eicmailcatcher-roundcube:
