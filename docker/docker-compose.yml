services:
  apache:
    build:
      context: ./apache
    container_name: ${APP_NAME}_apache
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PHP_HOST: "php"
    ports:
      - ${APP_PORT}:80
    volumes:
      - ./apache/vhosts:/etc/apache2/sites-enabled
    volumes_from:
      - php

  php:
    build:
      context: ./php
    container_name: ${APP_NAME}_php
    working_dir: /var/www/html
    volumes:
      - /var/www/html
      - ../lib/eic_config:/opt/drupal/vendor/civicrm/civicrm-core/ext/eic_config:bind
      - ../lib/eic_import:/opt/drupal/vendor/civicrm/civicrm-core/ext/eic_import:bind      
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - .env

  mysql:
    image: mariadb:10.6
    container_name: ${APP_NAME}_mysql
    ports:
      - ${DATABASE_PORT}:3306
    command: --transaction-isolation=READ-COMMITTED --innodb-log-file-size=1G --max_allowed_packet=1G --innodb-buffer-pool-size=512M --wait_timeout=3000 --net_write_timeout=3000
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DRUPAL_DATABASE_NAME}
      MYSQL_PASSWORD: ${DRUPAL_DATABASE_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin" ,"ping", "-h", "localhost", "-uroot", "--silent" ]
      interval: 2s
      timeout: 10s
      retries: 5

volumes:
  mysql_data: