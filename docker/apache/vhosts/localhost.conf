<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html
    <Directory /var/www/html>
        # enable the .htaccess rewrites
        AllowOverride All
        Require all granted
    </Directory>

    # Uncomment the following line to force Apache to pass the Authorization
    # header to PHP: required for "basic_auth" under PHP-FPM and FastCGI
    #
    SetEnvIfNoCase ^Authorization$ "(.+)" HTTP_AUTHORIZATION=$1

    # Using SetHandler avoids issues with using ProxyPassMatch in combination
    # with mod_rewrite or mod_autoindex
    # In ECS Fargate with AWSVPC the containers share the same network namespace, localhost is used
    <Location "/index.php">
        <If "%{env:PHP_HOST} == 'php'">
                SetHandler proxy:fcgi://php:9000
        </If>
        <Else>
                SetHandler proxy:fcgi://127.0.0.1:9000
        </Else>
    </Location>
   
#    Define "APACHE_LOG_LEVEL_${APACHE_LOG_LEVEL}"
#    <IfDefine APACHE_LOG_LEVEL_>
#        LogLevel error
#    </If>
#    <Else>
#        LogLevel %{env:APACHE_LOG_LEVEL}
#    </Else>

    # Log errors to stderr
    ErrorLog /proc/self/fd/2 
    # Log access to stdout 
    CustomLog /proc/self/fd/1 combined    

</VirtualHost>
